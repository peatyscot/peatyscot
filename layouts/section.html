{{ define "main" }}
<div class="prose">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  {{ .Content }}
</div>
<ul class="card-grid">
  {{ range .Paginator.Pages }}{{ partial "card.html" . }}{{ end }}
</ul>
{{ partial "pagination.html" . }}
{{ partial "ad-slot.html" (dict "ctx" . "slot" "in-article") }}
{{ end }}
